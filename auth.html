<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول والاشتراك | Kick Off</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
    .tab-btn { background: transparent; border: none; color: #94a3b8; font-size: 1.1rem; font-weight: 600; cursor: pointer; padding: 5px 10px; }
    .tab-btn.active { color: #22c55e; border-bottom: 3px solid #22c55e; }
  </style>
</head>
<body>

  <section class="auth-page">
    <div class="auth-form glass-card animate-fade-in">
      <div class="tabs">
        <button id="loginTab" class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
        <button id="registerTab" class="tab-btn" onclick="switchTab('register')">إنشاء حساب جديد</button>
      </div>

      <!-- نموذج تسجيل الدخول -->
      <form id="loginForm">
        <input type="text" id="loginUser" placeholder="اسم المستخدم" required class="form-input">
        <input type="password" id="loginPass" placeholder="كلمة المرور" required class="form-input">
        <button type="submit" class="btn btn-gradient" style="width:100%; border:none; margin-top:10px;">دخول المنصة</button>
      </form>

      <!-- نموذج التسجيل الجديد -->
      <form id="registerForm" class="hidden">
        <input type="text" id="regUser" placeholder="اسم المستخدم المشترك" required class="form-input">
        <input type="tel" id="regPhone" placeholder="رقم الهاتف المحمول" required class="form-input">
        <input type="password" id="regPass" placeholder="كلمة المرور القوية" required class="form-input">
        
        <select id="regRole" required class="form-input" onchange="toggleLocationField()">
          <option value="player">أنا لاعب (أريد حجز الملاعب)</option>
          <option value="owner">أنا صاحب ملعب (لدي ملاعب للاستثمار)</option>
        </select>

        <select id="regLocation" class="form-input hidden">
          <option value="">اختر النطاق الجغرافي لملاعبك</option>
          <option value="القاهرة">القاهرة</option>
          <option value="الجيزة">الجيزة</option>
          <option value="الإسكندرية">الإسكندرية</option>
        </select>

        <button type="submit" class="btn btn-gradient" style="width:100%; border:none; margin-top:10px;">إتمام الاشتراك</button>
      </form>

      <a href="index.html" style="display:block; text-align:center; margin-top:20px; color:#94a3b8; text-decoration:none;">← تصفح بدون تسجيل</a>
    </div>
  </section>

  <script>
    const API_URL = 'http://localhost:3000/api';
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');

    function switchTab(type) {
      if(type === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        loginTab.classList.remove('active');
        registerTab.classList.add('active');
      }
    }

    function toggleLocationField() {
      const role = document.getElementById('regRole').value;
      const locField = document.getElementById('regLocation');
      if(role === 'owner') {
        locField.classList.remove('hidden');
        locField.required = true;
      } else {
        locField.classList.add('hidden');
        locField.required = false;
      }
    }

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUser').value;
      const phone = document.getElementById('regPhone').value;
      const password = document.getElementById('regPass').value;
      const role = document.getElementById('regRole').value;
      const location = document.getElementById('regLocation').value;

      try {
        const res = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, phone, password, role, location })
        });
        const data = await res.json();
        if(res.ok) {
          alert('تم إنشاء حسابك بنجاح! يمكنك الآن تسجيل الدخول مباشرة.');
          switchTab('login');
        } else { alert(data.message); }
      } catch(err) { alert('فشل الاتصال بالسيرفر لتسجيل الحساب!'); }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if(res.ok) {
          localStorage.setItem('user', JSON.stringify(data.user));
          alert(`مرحباً بك كابتن ${data.user.username}`);
          window.location.href = 'index.html';
        } else { alert(data.message); }
      } catch(err) { alert('فشل تسجيل الدخول، تأكد من تشغيل السيرفر!'); }
    });
  </script>
</body>
</html>
